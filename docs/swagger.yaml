basePath: /api
definitions:
  api.JsonError:
    properties:
      message:
        example: error message
        type: string
    type: object
  service.CategoryData:
    properties:
      genre_id:
        example: 1
        type: integer
    required:
    - genre_id
    type: object
  service.Celebrity:
    properties:
      birth_date:
        example: "1969-12-28T00:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      name:
        example: Linus Torvalds
        type: string
    type: object
  service.CelebrityData:
    properties:
      birth_date:
        example: "1969-12-28T00:00:00Z"
        type: string
      name:
        example: Linus Torvalds
        maxLength: 255
        type: string
    required:
    - birth_date
    - name
    type: object
  service.Genre:
    properties:
      id:
        example: 1
        type: integer
      name:
        example: horror
        type: string
    type: object
  service.GenreData:
    properties:
      name:
        example: horror
        maxLength: 255
        type: string
    required:
    - name
    type: object
  service.Movie:
    properties:
      duration_minutes:
        example: 255
        type: integer
      id:
        example: 1
        type: integer
      poster_url:
        example: https://www.amazon.nl/Lord-Strings-J-Khan/dp/B000BU9TAQ
        type: string
      released_at:
        example: "2025-10-30T00:00:00Z"
        type: string
      synopsis:
        example: A man that can manipulate every string variable
        type: string
      title:
        example: Lord of the Strings
        type: string
    type: object
  service.MovieData:
    properties:
      duration_minutes:
        example: 255
        type: integer
      poster_url:
        example: https://www.amazon.nl/Lord-Strings-J-Khan/dp/B000BU9TAQ
        type: string
      released_at:
        example: "2025-10-30T00:00:00Z"
        type: string
      synopsis:
        example: A man that can manipulate every string variable
        maxLength: 5000
        type: string
      title:
        example: Lord of the Strings
        maxLength: 255
        type: string
    required:
    - duration_minutes
    - released_at
    - synopsis
    - title
    type: object
  service.Rating:
    properties:
      created_at:
        example: "2025-10-30T00:00:00Z"
        type: string
      movie_id:
        example: 2
        type: integer
      rating:
        example: 5
        type: integer
      user_id:
        example: 1
        type: integer
    type: object
  service.RatingData:
    properties:
      movie_id:
        example: 2
        type: integer
      rating:
        example: 5
        maximum: 10
        type: integer
    required:
    - movie_id
    - rating
    type: object
  service.Review:
    properties:
      comment:
        example: 'Seriously... Who made this? '
        type: string
      created_at:
        example: "2025-10-30T00:00:00Z"
        type: string
      movie_id:
        example: 2
        type: integer
      user_id:
        example: 1
        type: integer
    type: object
  service.ReviewData:
    properties:
      comment:
        example: Seriously... Who made this?
        maxLength: 255
        type: string
      movie_id:
        example: 2
        type: integer
    required:
    - comment
    - movie_id
    type: object
  service.Role:
    properties:
      celebrity_id:
        example: 1
        type: integer
      movie_id:
        example: 2
        type: integer
      role:
        example: Tech Guy
        type: string
    type: object
  service.RoleData:
    properties:
      celebrity_id:
        example: 1
        type: integer
      role:
        example: Tech Guy
        maxLength: 255
        type: string
    required:
    - celebrity_id
    - role
    type: object
  service.UpdatableRatingData:
    properties:
      rating:
        example: 5
        type: integer
    required:
    - rating
    type: object
  service.UpdatableReviewData:
    properties:
      comment:
        example: Seriously... Who made this?
        maxLength: 255
        type: string
    required:
    - comment
    type: object
  service.UpdatableRoleData:
    properties:
      role:
        example: Tech Guy
        maxLength: 255
        type: string
    required:
    - role
    type: object
  service.UpdatableUserData:
    properties:
      mail:
        example: smokeseller@gmail.com
        maxLength: 255
        type: string
      username:
        example: thescrummaster1
        maxLength: 255
        type: string
    required:
    - mail
    - username
    type: object
  service.User:
    properties:
      created_at:
        example: "2025-10-30T00:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      mail:
        example: smokeseller@gmail.com
        type: string
      password:
        example: notofyourbusiness
        type: string
      username:
        example: thescrummaster1
        type: string
    type: object
  service.UserData:
    properties:
      mail:
        example: smokeseller@gmail.com
        maxLength: 255
        type: string
      password:
        example: notofyourbusiness
        maxLength: 255
        type: string
      username:
        example: thescrummaster1
        maxLength: 255
        type: string
    required:
    - mail
    - password
    - username
    type: object
