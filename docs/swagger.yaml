  version: "1.0"
paths:
  /celebrities:
    get:
      consumes:
      - application/json
      description: Obtiene una lista de celebridades con paginación.
      parameters:
      - description: Número de página
        in: query
        name: page
        required: true
        type: integer
      - description: Cantidad de filas por página
        in: query
        name: rows
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Lista de celebridads exitosa
          schema:
            items:
              $ref: '#/definitions/service.Celebrity'
            type: array
        "400":
          description: Error de validación de los parámetros
          schema:
            $ref: '#/definitions/api.JsonError'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/api.JsonError'
      summary: Lista celebridades paginadas
      tags:
      - Celebrities
    post:
      consumes:
      - application/json
      description: Agrega una nueva celebridad al catálogo.
      parameters:
      - description: Datos de la celebridad
        in: body
        name: celebrity
        required: true
        schema:
          $ref: '#/definitions/service.CelebrityData'
      produces:
      - application/json
      responses:
        "201":
          description: Celebridad agregada exitosamente
          schema:
            $ref: '#/definitions/service.Celebrity'
        "400":
          description: Error de validación de los parámetros
          schema:
            $ref: '#/definitions/api.JsonError'
        "409":
          description: Error de duplicacion de recursos
          schema:
            $ref: '#/definitions/api.JsonError'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/api.JsonError'
      summary: Agrega una celebridad
      tags:
      - Celebrities
  /celebrities/{ID}:
    delete:
      consumes:
      - application/json
      description: Borra una celebridad dada por ID permanentemente de la base de
        datos.
      parameters:
      - description: ID de la celebridad a eliminar
        in: path
        name: ID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Celebridad eliminada exitosamente
        "400":
          description: Error de validación de los parámetros
          schema:
            $ref: '#/definitions/api.JsonError'
        "404":
          description: Error por celebridad no encontrada
          schema:
            $ref: '#/definitions/api.JsonError'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/api.JsonError'
      summary: Borra una celebridad
      tags:
      - Celebrities
    get:
      consumes:
      - application/json
      description: Obtiene toda la información asociada a una celebridad dada por
        ID.
      parameters:
      - description: ID de la celebridad a obtener
        in: path
        name: ID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Celebridad obtenida exitosamente
          schema:
            $ref: '#/definitions/service.Celebrity'
        "400":
          description: Error de validación de los parámetros
          schema:
            $ref: '#/definitions/api.JsonError'
        "404":
          description: Error por celebridad no encontrada
          schema:
            $ref: '#/definitions/api.JsonError'
        "500":
          description: Error interno del servidor
          schema:
            $ref: '#/definitions/api.JsonError'
      summary: Obtiene una celebridad
      tags:
      - Celebrities
    put:
      consumes:
      - application/json
      description: Actualiza toda la información de una celebridad dado por ID. Todos
        los campos son requeridos.
      parameters:
      - description: ID de la celebridad a actualizar
        in: path
        name: ID
        required: true
        type: integer
      - description: Datos actualizables de la celebridad
        in: body
        name: celebrity
        required: true
        schema:
          $ref: '#/definitions/service.CelebrityData'
      produces:
      - application/json
      responses:
        "200":
          description: Celebridad actualizada exitosamente
          schema:
            $ref: '#/definitions/service.Celebrity'
        "400":
          description: Error de validación de los parámetros
          schema:
            $ref: '#/definitions/api.JsonError'
        "404":
          description: Error por celebridad no encontrada
          schema:
            $ref: '#/definitions/api.JsonError'
        "409":
          description: Error de duplicación de recursos
          schema:
