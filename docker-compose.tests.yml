services:
  # Servicio para la base de datos PostgreSQL de Testing
  db_test:
    image: postgres:15-alpine
    container_name: movies-db-test
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TEST_POSTGRES_DB}
    volumes:
      - ./internal/storage/postgres/schema/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_POSTGRES_USER} -d ${TEST_POSTGRES_DB}"]
      interval: 5s
  # Servicio para levantar la API REST
  app_test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movies-app-test
    environment:
      POSTGRES_HOST: db_test
      POSTGRES_PORT: ${TEST_POSTGRES_PORT}
      POSTGRES_USER: ${TEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TEST_POSTGRES_DB}
    depends_on:
      db_test:
        condition: service_healthy
  # Servicio para correr los Tests
  test-runner:
    build:
      context: .
      dockerfile: test/Dockerfile
    container_name: api-tests-runner
    environment:
      APP_TEST_URL: "http://app_test:8080"
    command: ["/app/test/run_all_tests.sh"]
    depends_on:
      - app_test